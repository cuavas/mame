name: CI (macOS)

on:
  push:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macOS-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: brew install python3 sdl3
    - name: Build
      env:
        USE_LIBSDL: 1
        SUBTARGET: drctest
        SOURCES: src/mame/misc/drctester.cpp
      run: make -j2
    - name: Validate
      env:
        SDL_AUDIODRIVER: dummy
        SDL_VIDEODRIVER: dummy
      run: ./drctest -video none -sound none drctester > drctester.log || true
    - uses: actions/upload-artifact@main
      with:
        name: drctest-macos-${{ github.sha }}
        path: |
          drctester.log
        if-no-files-found: error

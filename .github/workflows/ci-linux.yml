name: CI (Linux)

on:
  push:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'
  pull_request:
    paths:
    - '.github/workflows/**'
    - '3rdparty/**'
    - 'scripts/**'
    - 'src/**'
    - 'COPYING'
    - 'makefile'

permissions:
  contents: read

jobs:
  build-linux:
    strategy:
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
            archopts: -U_FORTIFY_SOURCE
          - compiler: clang
            cc: clang
            cxx: clang++
            subtarget: mame
            executable: mame
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@main
      with:
        fetch-depth: 0
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev libfontconfig-dev libasound2-dev libxinerama-dev libxi-dev qt6-base-dev qt6-base-dev-tools
    - name: Install clang
      if: matrix.compiler == 'clang'
      run: sudo apt-get install -y clang
    - name: Build
      env:
        OVERRIDE_CC: ${{ matrix.cc }}
        OVERRIDE_CXX: ${{ matrix.cxx }}
        ARCHOPTS: ${{ matrix.archopts }}
        SUBTARGET: drctest
        SOURCES: src/mame/misc/drctester.cpp
      run: make -j3
    - name: Validate
      env:
        SDL_AUDIODRIVER: dummy
        SDL_VIDEODRIVER: dummy
      run: ./drctest -video none -sound none drctester > drctester.log || true
    - uses: actions/upload-artifact@main
      with:
        name: drctest-linux-${{ matrix.compiler }}-${{ github.sha }}
        path: |
          drctester.log
        if-no-files-found: error
